[project]
name = "videofetch"
version = "0.1.0"
description = "Распределённая система обнаружения и загрузки видеоматериалов (лабораторная работа)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["coordinator", "mockserver", "agent"]
testpaths = ["coordinator/tests", "mockserver/tests", "agent/tests"]
asyncio_mode = "auto"
markers = ["pg: тесты, требующие PostgreSQL (VF_TEST_DATABASE_URL)"]
